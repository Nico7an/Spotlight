name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests unitaires
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK arm64
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          dest="Spotlight-v${VERSION_NAME}-arm64-v8a.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "${{ steps.apk.outputs.path }}" \
            --target "${GITHUB_SHA}" \
            --title "Spotlight ${VERSION_NAME}" \
            --generate-notes \
            --latest
